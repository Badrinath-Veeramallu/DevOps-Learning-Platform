<style>/* StepAnimation.css — palette taken from your DevOps Platform screenshots
   (deep maroon buttons, plum headline gradient, blush pills, near-black ink, soft grid backdrop). */
.sa {
  --sa-ink: #1a1625;          /* headings */
  --sa-maroon: #3b1c22;       /* primary buttons / brand fills */
  --sa-plum: #6b3340;         /* "Building Real Systems" gradient end */
  --sa-rose: #a8657a;         /* heat-map mid tone, lines */
  --sa-blush: #e6cfd4;        /* pill borders */
  --sa-mist: #f7eef0;         /* pill / tag background */
  --sa-tint: #fcf8f8;         /* page background tint */
  --sa-line: #ecdfe1;         /* card borders */
  --sa-muted: #5f5867;
  --sa-ok: #3f7a5f;           /* success (only semantic additions) */
  --sa-bad: #b3363f;
  --sa-warn-bg: #fff6dc;      /* "email unverified" banner colours */
  --sa-warn-bd: #efdca0;
  --sa-warn-tx: #7a4e00;

  font-family: "Plus Jakarta Sans", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--sa-ink);
  background: #fff;
  border: 1px solid var(--sa-line);
  border-radius: 20px;
  box-shadow: 0 14px 40px -24px rgba(59, 28, 34, .45);
  overflow: hidden;
  overflow: clip; /* clip (not hidden) keeps the sticky caption bar working on phones */
  outline: none;
}
.sa:focus-visible { box-shadow: 0 0 0 3px rgba(168, 101, 122, .35); }

/* header */
.sa-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 22px; border-bottom: 1px solid var(--sa-line); background: linear-gradient(180deg, #fff, var(--sa-tint)); }
.sa-head h3 { margin: 6px 0 0; font-size: 1.15rem; letter-spacing: -.01em; }
.sa-chip { display: inline-flex; align-items: center; gap: 8px; font-size: .72rem; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: #fff; border: 1px solid var(--sa-line); color: var(--sa-plum); }
.sa-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--sa-maroon); }
.sa-count { font-weight: 700; color: var(--sa-maroon); white-space: nowrap; }
.sa-count em { font-style: normal; color: var(--sa-muted); font-weight: 500; }

/* stage */
.sa-scroll { overflow-x: auto; }
.sa-stage {
  position: relative; min-width: 640px; aspect-ratio: 1000 / 400; container-type: inline-size;
  background-color: var(--sa-tint);
  background-image: linear-gradient(rgba(236, 223, 225, .55) 1px, transparent 1px), linear-gradient(90deg, rgba(236, 223, 225, .55) 1px, transparent 1px);
  background-size: 4cqw 4cqw;
}
.sa-edges { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }
.sa-edge { animation: sa-fade .5s ease both; }
.sa-edge line { stroke: var(--sa-rose); stroke-width: 2.2; stroke-linecap: round; }
.sa-edge text { font: 600 13px "Plus Jakarta Sans", system-ui, sans-serif; fill: var(--sa-plum); stroke: var(--sa-tint); stroke-width: 5; paint-order: stroke; }
.e-dash line { stroke-dasharray: 7 6; animation: sa-flow 1s linear infinite; }
.e-ok line { stroke: var(--sa-ok); } .e-ok text { fill: var(--sa-ok); }
.e-warn line { stroke: var(--sa-bad); stroke-dasharray: 7 6; } .e-warn text { fill: var(--sa-bad); }

/* actors: positioned by % of stage; every change is a CSS transition */
.sa-a {
  position: absolute; z-index: 2; transform: translate(-50%, -50%) scale(1);
  font-size: max(9px, 1.3cqw); line-height: 1.25; text-align: center; box-sizing: border-box;
  transition: left .75s cubic-bezier(.4, 0, .2, 1), top .75s cubic-bezier(.4, 0, .2, 1), opacity .45s ease, transform .45s cubic-bezier(.2, .9, .3, 1.15),
    background-color .45s, border-color .45s, color .45s, box-shadow .45s;
}
.sa-a.is-hidden { opacity: 0; transform: translate(-50%, -50%) scale(.7); pointer-events: none; }
.sa-a.is-glow { animation: sa-glow 1.6s ease-in-out infinite; }
.sa-text { display: block; font-weight: 700; overflow-wrap: anywhere; }
.sa-sub { display: block; margin-top: .25em; font-size: .82em; font-weight: 500; opacity: .75; overflow-wrap: anywhere; }
.sa-ic { margin-right: .4em; font-weight: 800; }

/* tones */
.t-plain { background: #fff; border: 1.5px solid #e4d3d6; color: var(--sa-ink); }
.t-soft  { background: var(--sa-mist); border: 1.5px solid var(--sa-blush); color: var(--sa-maroon); }
.t-brand { background: var(--sa-maroon); border: 1.5px solid var(--sa-maroon); color: #fff; }
.t-warn  { background: var(--sa-warn-bg); border: 1.5px solid var(--sa-warn-bd); color: var(--sa-warn-tx); }
.t-ok    { background: #e9f4ee; border: 1.5px solid #b7d9c5; color: #24573f; }
.t-bad   { background: #fbeaec; border: 1.5px solid #efbcc2; color: #8f2631; }
.t-dim   { background: #f6f2f2; border: 1.5px dashed #d9cdd0; color: #9a8f93; }

/* shapes */
.sa-box  { padding: .8em 1em; border-radius: .9em; box-shadow: 0 6px 16px -10px rgba(59, 28, 34, .45); }
.sa-file { padding: .65em .5em .6em; border-radius: .5em; font-size: max(8px, 1.1cqw); box-shadow: 0 5px 12px -8px rgba(59, 28, 34, .5); clip-path: polygon(0 0, calc(100% - .9em) 0, 100% .9em, 100% 100%, 0 100%); }
.sa-pill { padding: .45em 1em; border-radius: 999px; white-space: nowrap; font-size: max(8.5px, 1.15cqw); font-weight: 700; }
.sa-pill .sa-text { display: inline; }
.sa-commit { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: max(8px, .95cqw); box-shadow: 0 6px 14px -8px rgba(59, 28, 34, .55); }
.sa-commit .sa-sub { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); white-space: nowrap; margin-top: .5em; color: var(--sa-muted); opacity: 1; font-size: max(8px, 1.05cqw); }
.sa-zone { z-index: 0; border-radius: 1.4em; border-style: dashed !important; background: rgba(247, 238, 240, .55); }
.t-brand.sa-zone { background: rgba(59, 28, 34, .05); border-color: var(--sa-plum); color: var(--sa-plum); }
.sa-zone-label { position: absolute; top: .8em; left: 1.1em; font-size: .85em; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; opacity: .8; }
.sa-bar { display: block; height: .5em; margin-top: .6em; border-radius: 99px; background: rgba(0, 0, 0, .1); overflow: hidden; }
.sa-bar i { display: block; height: 100%; background: currentColor; border-radius: inherit; transition: width .9s ease; }
.t-brand .sa-bar { background: rgba(255, 255, 255, .25); }

/* layer bars (image layers, stack levels) and storage cylinders (volumes) */
.sa-layer { padding: .5em .8em; border-radius: .55em; font-size: max(8.5px, 1.15cqw); box-shadow: 0 4px 10px -8px rgba(59, 28, 34, .5); }
.sa-layer .sa-text { font-weight: 700; }
.sa-vol { padding: 1.5em .6em .8em; border-radius: 45% / 16%; box-shadow: 0 6px 14px -8px rgba(59, 28, 34, .55); }
.sa-vol::before { content: ""; position: absolute; left: -1.5px; right: -1.5px; top: -1.5px; height: 34%; border: 1.5px solid currentColor; border-radius: 50%; background: rgba(255, 255, 255, .45); opacity: .55; }
.sa-vol .sa-text { position: relative; }

/* code panels (diffs, YAML, README, conflict markers…) */
.sa-code { background: #2a1419; color: #f3e4e7; border-radius: .9em; overflow: hidden; text-align: left; box-shadow: 0 10px 24px -14px rgba(59, 28, 34, .8); }
.sa-code-bar { display: flex; align-items: center; gap: .4em; padding: .55em .9em; background: var(--sa-maroon); font-size: .8em; color: #e6cfd4; }
.sa-code-bar i { width: .65em; height: .65em; border-radius: 50%; background: var(--sa-rose); opacity: .7; }
.sa-code-bar span { margin-left: .6em; font-weight: 600; }
.sa-code-body { padding: .6em 0; font: 500 max(8.5px, 1.02cqw) / 1.55 "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace; }
.sa-ln { padding: 0 1em; white-space: pre; overflow: hidden; animation: sa-ln .45s ease both; }
.sa-ln.add { background: rgba(80, 170, 125, .22); color: #c4f2d8; }
.sa-ln.del { background: rgba(224, 85, 100, .24); color: #ffd0d5; }
.sa-ln.hl { background: rgba(240, 200, 90, .2); color: #ffe9a8; }
.sa-ln.mark { color: #e0a9b9; font-weight: 800; }
.sa-ln.cur { background: rgba(168, 101, 122, .4); }
.sa-ln.inc { background: rgba(230, 207, 212, .2); }
.sa-ln.dim { opacity: .55; }

/* terminal */
.sa-term { margin: 0 16px 6px; border-radius: 14px; overflow: hidden; background: #2a1419; color: #e9d6da; box-shadow: 0 10px 24px -16px rgba(59, 28, 34, .8); }
.sa-term-bar { display: flex; align-items: center; gap: 6px; padding: 7px 12px; background: var(--sa-maroon); font-size: .72rem; color: #e6cfd4; }
.sa-term-bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--sa-rose); opacity: .7; }
.sa-term-bar span { margin-left: 8px; font-weight: 600; }
.sa-term-body { height: 8.6rem; overflow: auto; padding: 10px 14px; font: 500 .8rem / 1.65 "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace; }
.sa-tl { white-space: pre; }
.sa-tl.out { color: #cdb6bb; }
.sa-tl.tn\+ { color: #8fd6b0; } .sa-tl.tn\~ { color: #f0d48a; } .sa-tl.tn\! { color: #ff9aa4; }
.sa-prompt { color: var(--sa-blush); margin-right: .7ch; font-weight: 800; }
.sa-typed { display: inline-block; vertical-align: bottom; color: #fff; }
.sa-tl.new { opacity: 0; animation: sa-fade .01s var(--delay, 0ms) forwards; }
.sa-tl.new .sa-typed { overflow: hidden; width: 0; animation: sa-type var(--d, 600ms) steps(var(--n, 1), end) var(--delay, 0ms) forwards; }

/* caption + controls */
.sa-say { margin: 0; padding: 16px 22px 8px; min-height: 3.2em; font-size: 1.02rem; line-height: 1.5; color: var(--sa-ink); animation: sa-rise .4s ease both; }
.sa-ctrl { display: flex; align-items: center; gap: 8px; padding: 10px 18px 18px; flex-wrap: wrap; }
.sa-ctrl button { font: 600 .85rem "Plus Jakarta Sans", system-ui, sans-serif; cursor: pointer; border: 1px solid var(--sa-line); background: #fff; color: var(--sa-maroon); border-radius: 12px; padding: 8px 14px; transition: background .2s, transform .1s; }
.sa-ctrl button:hover:not(:disabled) { background: var(--sa-mist); }
.sa-ctrl button:active:not(:disabled) { transform: scale(.97); }
.sa-ctrl button:disabled { opacity: .4; cursor: default; }
.sa-ctrl button.primary { background: var(--sa-maroon); border-color: var(--sa-maroon); color: #fff; padding: 8px 20px; }
.sa-ctrl button.primary:hover { background: var(--sa-plum); }
.sa-dots { display: flex; gap: 6px; margin-left: auto; }
.sa-dots button { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 0; background: #ecdfe1; }
.sa-dots button.done { background: var(--sa-rose); }
.sa-dots button.on { background: var(--sa-maroon); transform: scale(1.35); }

@keyframes sa-wipe { to { clip-path: inset(0 0 0 0); } }
@keyframes sa-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sa-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes sa-ln { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
@keyframes sa-type { to { width: calc(var(--n, 1) * 1ch); } }
@keyframes sa-flow { to { stroke-dashoffset: -26; } }
@keyframes sa-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(168, 101, 122, .0); } 50% { box-shadow: 0 0 0 .7cqw rgba(168, 101, 122, .28); } }

@media (prefers-reduced-motion: reduce) {
  .sa *, .sa *::before { transition: none !important; animation: none !important; }
  .sa-tl.new { opacity: 1; } .sa-tl.new .sa-typed { width: auto; }
}

/* ======================================================================
   PHONE LAYOUT  (.is-compact is set by the component when it is < 640px wide,
   so it also works inside narrow panels, split-screen and small tablets)
   Stage = 360 x N portrait canvas; flows run top -> bottom.
   ====================================================================== */
.sa.is-compact { border-radius: 16px; }
.sa.is-compact .sa-head { padding: 12px 14px; }
.sa.is-compact .sa-head h3 { font-size: 1rem; line-height: 1.25; }
.sa.is-compact .sa-scroll { overflow: visible; }
.sa.is-compact .sa-stage { min-width: 0; max-width: 440px; margin: 0 auto; background-size: 8cqw 8cqw; touch-action: pan-y; }

.sa.is-compact .sa-a { font-size: max(10px, 2.9cqw); }
.sa.is-compact .sa-box { padding: .7em .8em; }
.sa.is-compact .sa-file { font-size: max(9.5px, 2.65cqw); padding: .6em .4em .55em; }
.sa.is-compact .sa-pill { font-size: max(9.5px, 2.8cqw); white-space: normal; max-width: 92%; text-align: center; line-height: 1.25; padding: .4em .9em; }
.sa.is-compact .sa-pill .sa-text { display: inline; }
.sa.is-compact .sa-commit { font-size: max(8px, 2.3cqw); }
.sa.is-compact .sa-commit .sa-sub { font-size: max(9px, 2.6cqw); margin: 0; top: 50%; transform: translateY(-50%); white-space: nowrap; }
.sa.is-compact .sa-commit.side-r .sa-sub { left: 100%; margin-left: .5em; text-align: left; }
.sa.is-compact .sa-commit.side-l .sa-sub { left: auto; right: 100%; margin-right: .5em; text-align: right; }
.sa.is-compact .sa-zone-label { font-size: .75em; top: .6em; left: .9em; }

/* code panels: full width, wrap long lines instead of clipping */
.sa.is-compact .sa-code-body { font-size: max(8.5px, 2.45cqw); line-height: 1.5; }
.sa.is-compact .sa-code-bar { font-size: max(8.5px, 2.4cqw); }
.sa.is-compact .sa-ln { white-space: pre-wrap; overflow-wrap: anywhere; }

.sa.is-compact .sa-edge text { font-size: 11px; stroke-width: 4; }
.sa.is-compact .sa-edge line { stroke-width: 2; }

/* terminal: wrap long commands; "typing" becomes a left-to-right reveal */
.sa.is-compact .sa-term { margin: 0 10px 6px; }
.sa.is-compact .sa-term-body { height: 7.4rem; font-size: .7rem; padding: 8px 10px; }
.sa.is-compact .sa-tl { white-space: pre-wrap; word-break: break-all; }
.sa.is-compact .sa-tl.new .sa-typed { display: inline-block; max-width: calc(100% - 2ch); width: auto; overflow: visible; clip-path: inset(0 100% 0 0); animation: sa-wipe var(--d, 600ms) steps(var(--n, 1), end) var(--delay, 0ms) forwards; }

/* caption + controls dock to the bottom of the screen while the stage scrolls */
.sa.is-compact .sa-dock { position: sticky; bottom: 0; z-index: 5; background: rgba(255, 255, 255, .96); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-top: 1px solid var(--sa-line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sa.is-compact .sa-say { padding: 10px 14px 4px; min-height: 0; font-size: .92rem; line-height: 1.45; }
.sa.is-compact .sa-ctrl { padding: 6px 12px 12px; gap: 8px; flex-wrap: nowrap; }
.sa.is-compact .sa-ctrl button { min-width: 44px; min-height: 44px; padding: 0 12px; font-size: 1rem; border-radius: 14px; }
.sa.is-compact .sa-ctrl button.primary { flex: 1; font-size: .9rem; }
.sa.is-compact .sa-dots { display: none; }

@media (prefers-reduced-motion: reduce) {
  .sa.is-compact .sa-tl.new .sa-typed { clip-path: none; }
}

// stepEngine.js — pure logic (no React). Turns a list of "steps" into renderable frames.
//
// A step only describes what CHANGES. Actors (files, commits, boxes, pills, code panels,
// zones) are created the first time they appear, then moved / re-coloured / hidden by later
// steps. The player renders every actor once and lets CSS transitions animate the changes.

const STAGE = { w: 1000, h: 400 }; // coordinate space used for edges (actors use % of stage)

const DEFAULT_W = { file: 10, commit: 6, pill: 0, box: 16, code: 30, note: 0, zone: 30, vol: 12, layer: 24 };
// phone layout: widths are % of a 360px-wide canvas
const DEFAULT_W_MOBILE = { file: 22, commit: 13, pill: 0, box: 36, code: 94, note: 0, zone: 30, vol: 26, layer: 60 };
const HALF_H = { file: 28, commit: 26, pill: 13, box: 26, note: 10, vol: 32, layer: 15 };

/** frames[i] = { actors, edges, term, termStart, say } — the complete scene at step i */
function buildFrames(steps) {
  const first = {};
  steps.forEach((s) =>
    Object.entries(s.actors || {}).forEach(([id, p]) => {
      if (p && !first[id]) first[id] = p;
    })
  );

  let cur = {};
  let edges = [];
  let term = [];

  return steps.map((s) => {
    const patch = s.actors || {};
    const next = {};
    for (const id in first) {
      const prev = cur[id];
      const p = patch[id];
      if (p === undefined) next[id] = prev ? { ...prev, delay: 0 } : { ...first[id], hide: true, delay: 0 };
      else if (p === null) next[id] = { ...(prev || first[id]), hide: true, delay: 0 };
      else next[id] = { ...(prev || first[id]), ...p, hide: false, delay: p.delay || 0 };
    }
    cur = next;
    if (s.edges) edges = s.edges;
    if (s.clear) term = [];
    const added = s.term || [];
    const termStart = term.length;
    term = [...term, ...added];
    return { actors: next, edges, term, termStart, say: s.say };
  });
}

function halfSize(a, stage) {
  const mobile = stage.w < 600;
  if (mobile) {
    const wp = ((a.w ?? DEFAULT_W_MOBILE[a.k]) * stage.w) / 100;
    if (a.k === "pill" || a.k === "note") {
      const full = String(a.text).length * 6.2 + 24;
      const w = a.w ? wp : Math.min(full, stage.w * 0.9);
      const n = Math.max(1, Math.ceil((String(a.text).length * 6.2) / Math.max(20, w - 24)));
      return [w / 2, (n * 13 + 10) / 2];
    }
    if (a.k === "code") return [wp / 2, ((a.lines || []).length * 14 + 40) / 2];
    if (a.k === "commit") return [wp / 2, wp / 2];
    return [wp / 2, a.k === "file" ? 24 : a.k === "layer" ? 12 : a.k === "vol" ? 30 : 27];
  }
  const w = a.w ?? DEFAULT_W[a.k];
  if (a.k === "pill" || a.k === "note") return [(String(a.text).length * 7.2 + 30) / 2, HALF_H.pill];
  if (a.k === "code") return [w * 5, ((a.lines || []).length * 5 + 12) * 2];
  return [w * 5, HALF_H[a.k] || 26];
}

/** Line between two actors, trimmed so arrows stop at the actors' borders (viewBox units). */
function edgeGeometry(a, b, stage = STAGE) {
  const sx = stage.w / 100, sy = stage.h / 100;
  const ax = a.x * sx, ay = a.y * sy, bx = b.x * sx, by = b.y * sy;
  const dx = bx - ax, dy = by - ay;
  const len = Math.hypot(dx, dy);
  if (!len) return null;
  const t = (h) => Math.min(dx ? h[0] / Math.abs(dx) : Infinity, dy ? h[1] / Math.abs(dy) : Infinity);
  const ta = t(halfSize(a, stage)), tb = t(halfSize(b, stage));
  if (ta + tb >= 0.98) return null; // actors touch: no room for a line
  const ux = dx / len, uy = dy / len, gap = stage.w < 600 ? 3 : 5;
  return {
    x1: ax + dx * ta + ux * gap, y1: ay + dy * ta + uy * gap,
    x2: bx - dx * tb - ux * gap, y2: by - dy * tb - uy * gap,
    mx: (ax + bx) / 2, my: (ay + by) / 2,
  };
}

/** Look an animation up by id ("04.5"), by "module.subtopic" numbers, or by (normalised) title. */
function findAnimation(data, key) {
  const norm = (t) => String(t).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  for (const m of data.modules)
    for (const s of m.subtopics) {
      if (s.id === key || norm(s.title) === norm(key)) return { ...s, moduleId: m.id, moduleTitle: m.title };
    }
  return null;
}


/* ---------- small renderers ---------- */

function Actor({ a, compact }) {
  const w = a.w ?? (compact ? DEFAULT_W_MOBILE : DEFAULT_W)[a.k];
  const style = {
    left: `${a.x}%`,
    top: `${a.y}%`,
    transitionDelay: a.delay ? `${a.delay}ms` : undefined,
  };
  if (w) style.width = `${w}%`;
  if (a.k === "zone") style.height = `${a.h}%`;
  const cls = ["sa-a", `sa-${a.k}`, `t-${a.tone || (a.k === "zone" ? "soft" : "plain")}`];
  if (a.hide) cls.push("is-hidden");
  if (a.glow) cls.push("is-glow");
  if (compact && a.k === "commit") cls.push(`side-${a.side || "r"}`);

  if (a.k === "code") {
    return (
      <div className={cls.join(" ")} style={style}>
        {a.title && <div className="sa-code-bar"><i /><i /><i /><span>{a.title}</span></div>}
        <div className="sa-code-body">
          {a.lines.map((l, i) => {
            const [text, c] = Array.isArray(l) ? l : [l, ""];
            return (
              <div key={`${i}-${text}`} className={`sa-ln ${c}`} style={{ animationDelay: `${i * 70}ms` }}>
                {text || "\u00a0"}
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  return (
    <div className={cls.join(" ")} style={style}>
      {a.k === "zone" ? (
        <span className="sa-zone-label">{a.text}</span>
      ) : (
        <>
          {a.ic && <b className="sa-ic">{a.ic}</b>}
          <span className="sa-text">{a.text}</span>
          {a.sub && <small className="sa-sub">{a.sub}</small>}
          {a.bar != null && <span className="sa-bar"><i style={{ width: `${a.bar}%` }} /></span>}
        </>
      )}
    </div>
  );
}

function Edges({ frame, uid, stage }) {
  const out = [];
  frame.edges.forEach(([from, to, label, style], i) => {
    const a = frame.actors[from], b = frame.actors[to];
    if (!a || !b || a.hide || b.hide) return;
    const g = edgeGeometry(a, b, stage);
    if (!g) return;
    const kind = style || "base";
    out.push(
      <g key={`${from}>${to}`} className={`sa-edge e-${kind}`}>
        <line x1={g.x1} y1={g.y1} x2={g.x2} y2={g.y2} markerEnd={`url(#${uid}-${kind})`} />
        {label ? <text x={g.mx} y={g.my - 7} textAnchor="middle">{label}</text> : null}
      </g>
    );
  });
  const marker = (kind, color) => (
    <marker key={kind} id={`${uid}-${kind}`} viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill={color} />
    </marker>
  );
  return (
    <svg className="sa-edges" viewBox={`0 0 ${stage.w} ${stage.h}`} aria-hidden="true">
      <defs>
        {marker("base", "var(--sa-rose)")}
        {marker("dash", "var(--sa-rose)")}
        {marker("ok", "var(--sa-ok)")}
        {marker("warn", "var(--sa-bad)")}
      </defs>
      {out}
    </svg>
  );
}

function Terminal({ frame, step }) {
  const ref = useRef(null);
  useEffect(() => { if (ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [step]);
  let t = 0; // running delay so each new command "types" before its output appears
  return (
    <div className="sa-term" role="log" aria-label="Terminal">
      <div className="sa-term-bar"><i /><i /><i /><span>terminal</span></div>
      <div className="sa-term-body" ref={ref}>
        {frame.term.map((line, i) => {
          const isNew = i >= frame.termStart;
          const isCmd = line.startsWith("$ ");
          const tone = !isCmd && /^[+~!]/.test(line) ? line[0] : "";
          const text = tone ? line.slice(1) : line;
          let style;
          if (isNew) {
            const ms = isCmd ? Math.min(text.length * 26, 1500) : 180;
            style = isCmd
              ? { "--n": text.length - 2, "--d": `${ms}ms`, "--delay": `${t}ms` }
              : { "--delay": `${t}ms` };
            t += ms + 150;
          }
          return (
            <div key={`${i}-${text}`} className={`sa-tl ${isCmd ? "cmd" : "out"} ${tone ? "tn" + tone : ""} ${isNew ? "new" : ""}`} style={style}>
              {isCmd ? (<><span className="sa-prompt">$</span><span className="sa-typed">{text.slice(2)}</span></>) : text}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- player ---------- */

/** true while the component is narrower than `breakpoint` px (container-based, so it also works in narrow side panels) */
function useCompact(ref, breakpoint) {
  const [compact, setCompact] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const measure = () => setCompact(el.getBoundingClientRect().width < breakpoint);
    measure();
    if (typeof ResizeObserver === "undefined") { window.addEventListener("resize", measure); return () => window.removeEventListener("resize", measure); }
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    return () => ro.disconnect();
  }, [ref, breakpoint]);
  return compact;
}

/**
 * <StepAnimation animation={...} mobileAnimation={...} />
 *   animation       : one subtopic object from git-animations.json (desktop layout)
 *   mobileAnimation : the same subtopic from git-animations.mobile.json (portrait layout, optional)
 *   autoPlay        : start playing on mount (default true, skipped when the user prefers reduced motion)
 *   stepMs          : base time each step stays on screen (default 3400)
 *   breakpoint      : below this width (px) the phone layout is used (default 640)
 */
function StepAnimation({ animation, mobileAnimation, autoPlay = true, stepMs = 3400, showTitle = true, breakpoint = 640, className = "" }) {
  const uid = useId().replace(/:/g, "");
  const root = useRef(null);
  const compactWidth = useCompact(root, breakpoint);
  const compact = compactWidth && !!mobileAnimation;
  const active = compact ? mobileAnimation : animation;
  const stage = active.stage || STAGE;

  const frames = useMemo(() => buildFrames(active.steps), [active.steps]);
  const hasTerm = frames.some((f) => f.term.length);
  const last = frames.length - 1;

  const reduced = typeof window !== "undefined" && window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
  const [i, setI] = useState(0);
  const [playing, setPlaying] = useState(autoPlay && !reduced);

  useEffect(() => { setI(0); setPlaying(autoPlay && !reduced); }, [animation.id]); // new subtopic -> restart

  useEffect(() => {
    if (!playing) return;
    if (i >= last) { setPlaying(false); return; }
    const f = frames[i + 1];
    const typing = (f.term.length - f.termStart) * 700; // leave time for typed commands
    const id = setTimeout(() => setI((x) => x + 1), stepMs + typing);
    return () => clearTimeout(id);
  }, [playing, i, last, frames, stepMs]);

  const go = useCallback((n) => { setPlaying(false); setI(Math.max(0, Math.min(last, n))); }, [last]);
  const togglePlay = () => { if (playing) return setPlaying(false); if (i >= last) setI(0); setPlaying(true); };
  const onKey = (e) => {
    if (e.key === "ArrowRight") go(i + 1);
    if (e.key === "ArrowLeft") go(i - 1);
    if (e.key === " ") { e.preventDefault(); togglePlay(); }
  };

  // swipe left / right on the stage = next / previous step (vertical scrolling is left alone)
  const touch = useRef(null);
  const onTouchStart = (e) => { const t = e.touches[0]; touch.current = [t.clientX, t.clientY]; };
  const onTouchEnd = (e) => {
    if (!touch.current) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.current[0], dy = t.clientY - touch.current[1];
    touch.current = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(i + (dx < 0 ? 1 : -1));
  };

  const frame = frames[Math.min(i, last)];
  return (
    <section ref={root} className={`sa ${compact ? "is-compact" : ""} ${className}`} tabIndex={0} onKeyDown={onKey} aria-label={`Animation: ${animation.title}`}>
      {showTitle && (
        <header className="sa-head">
          <div>
            <span className="sa-chip"><i /> Animation</span>
            <h3>{animation.title}</h3>
          </div>
          <span className="sa-count">Step {Math.min(i, last) + 1} <em>/ {frames.length}</em></span>
        </header>
      )}

      <div className="sa-scroll">
        <div className="sa-stage" style={{ aspectRatio: `${stage.w} / ${stage.h}` }} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
          <Edges frame={frame} uid={uid} stage={stage} />
          {Object.entries(frame.actors).map(([id, a]) => <Actor key={id} a={a} compact={compact} />)}
        </div>
      </div>

      {hasTerm && <Terminal frame={frame} step={i} />}

      <div className="sa-dock">
        <p className="sa-say" aria-live="polite" key={i}>{frame.say}</p>
        <footer className="sa-ctrl">
          <button onClick={() => go(0)} aria-label="Restart" title="Restart">↺</button>
          <button onClick={() => go(i - 1)} disabled={i === 0} aria-label="Previous step">‹</button>
          <button className="primary" onClick={togglePlay} aria-label={playing ? "Pause" : "Play"}>{playing ? "❚❚ Pause" : i >= last ? "↻ Replay" : "▶ Play"}</button>
          <button onClick={() => go(i + 1)} disabled={i === last} aria-label="Next step">›</button>
          <div className="sa-dots">
            {frames.map((_, n) => (
              <button key={n} className={n === i ? "on" : n < i ? "done" : ""} onClick={() => go(n)} aria-label={`Go to step ${n + 1}`} />
            ))}
          </div>
        </footer>
      </div>
    </section>
  );
}


function Demo() {
  const names = Object.keys(COURSES);
  const [course, setCourse] = useState(names[0]);
  const [mi, setMi] = useState(0);
  const [si, setSi] = useState(0);
  const [phone, setPhone] = useState(false);
  const C = COURSES[course];
  const mod = C.d.modules[mi];
  const sub = mod.subtopics[si];
  const msub = C.m ? C.m.modules[mi].subtopics[si] : undefined;
  const pick = (n) => { setCourse(n); setMi(0); setSi(0); };
  return (
    <div className="demo">
      <header className="demo-top">
        <div className="logo">&gt;_</div>
        <div><b>DevOps</b> <span>Platform</span></div>
        <div className="seg">{names.map((n) => <button key={n} className={n === course ? "on" : ""} onClick={() => pick(n)}>{n}</button>)}</div>
        <div className="seg" style={{ marginLeft: "auto" }}>
          <button className={!phone ? "on" : ""} onClick={() => setPhone(false)}>Auto width</button>
          <button className={phone ? "on" : ""} onClick={() => setPhone(true)}>Phone frame (360px)</button>
        </div>
      </header>
      <div className="demo-grid">
        <nav>
          {C.d.modules.map((m, a) => (
            <div key={m.id}>
              <button className={"mod" + (a === mi ? " on" : "")} onClick={() => { setMi(a); setSi(0); }}>{m.id} · {m.title}</button>
              {a === mi && m.subtopics.map((s, b) => (
                <button key={s.id} className={"sub" + (b === si ? " on" : "")} onClick={() => setSi(b)}>{s.id} {s.title}</button>
              ))}
            </div>
          ))}
        </nav>
        <main className={phone ? "phone" : ""}><StepAnimation animation={sub} mobileAnimation={msub} /></main>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);

</script></body></html>
